name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PauseMic-macOS-universal
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
